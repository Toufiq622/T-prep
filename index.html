<style>
  :root{
    --bg:#0B0A17;
    --bg-soft:#151328;
    --card:#1B1832;
    --card-hi:#241F3F;
    --line:#2E2A4C;
    --violet:#8B5CF6;
    --indigo:#5B6EF5;
    --cyan:#22D3EE;
    --magenta:#FF5FCF;
    --gold:#FFC93C;
    --green:#3DDC97;
    --red:#FF6B6B;
    --text:#F3F0FF;
    --text-dim:#9C97BE;
    --text-dimmer:#5E5A82;
    --radius:16px;
    --grad-main: linear-gradient(135deg, var(--indigo), var(--violet));
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    font-family:'Hind Siliguri', sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Baloo Da 2', 'Hind Siliguri', sans-serif; }
  body{
    background-image:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(139,92,246,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, rgba(91,110,245,0.12), transparent 60%);
    background-attachment:fixed;
  }
  #app{ max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:110px; }

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px; background:rgba(10,12,20,0.85); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .back{ font-size:20px; color:var(--text-dim); cursor:pointer; padding:4px 8px; border-radius:8px; }
  .topbar .back:active{ background:var(--card); }
  .topbar h1{ font-size:18px; font-weight:700; flex:1; }
  .topbar .tag{ font-size:11px; color:var(--text-dimmer); }

  main{ flex:1; padding:18px; }
  /* ইনপুটে ফোকাস থাকা অবস্থায় নিচে বাড়তি জায়গা রাখা হয়, যাতে কীবোর্ডের উপরে স্ক্রল করে বাটন পর্যন্ত পৌঁছানো যায় */
  body.input-focused main{ padding-bottom:260px; }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit; font-size:15px; font-weight:600;
    border:none; border-radius:12px; padding:13px 18px; cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--grad-main); color:#fff; box-shadow:0 8px 24px -8px rgba(139,92,246,0.6); }
  .btn-magenta{ background:linear-gradient(135deg, var(--magenta), #E14FB8); color:#210014; }
  .btn-gold{ background:linear-gradient(135deg, var(--gold), #E8C22E); color:#241A00; }
  .btn-ghost{ background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn-danger{ background:rgba(255,107,107,0.12); color:var(--red); border:1px solid rgba(255,107,107,0.3); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:9px; }
  .btn[disabled]{ opacity:0.4; pointer-events:none; }

  /* Cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .card-hi{ background:var(--card-hi); }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .planet-btn{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color .15s;
  }
  .planet-btn:active{ border-color:var(--violet); }
  .planet-icon{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background:radial-gradient(circle at 30% 30%, var(--violet), #2E1A6B);
  }
  .planet-btn .meta{ flex:1; min-width:0; }
  .planet-btn .meta .name{ font-weight:700; font-size:16px; }
  .planet-btn .meta .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .planet-btn .chev{ color:var(--text-dimmer); font-size:18px; }

  /* Form elements */
  label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  input[type=text], input[type=number], textarea, select{
    width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:inherit; font-size:16px; margin-bottom:14px;
    scroll-margin-top:90px; scroll-margin-bottom:160px;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--violet); }
  textarea{ resize:vertical; min-height:70px; }
  .field-group{ margin-bottom:2px; }
  .hint{ font-size:12px; color:var(--text-dimmer); margin-top:-10px; margin-bottom:14px; }

  /* Chips / checkboxes */
  .chip-list{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .chip{
    background:var(--bg-soft); border:1.5px solid var(--line); border-radius:999px;
    padding:11px 20px; font-size:14px; cursor:pointer; color:var(--text-dim); font-weight:700;
    transition:all .12s;
  }
  .chip.active{
    background:var(--grad-main); border-color:transparent; color:#fff;
    box-shadow:0 6px 18px -6px rgba(139,92,246,0.7);
  }
  .chip-sm{ padding:7px 14px; font-size:12px; }

  .check-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer;
  }
  .check-row.checked{ border-color:var(--violet); background:rgba(139,92,246,0.10); }
  .check-box{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--text-dimmer); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bg);
  }
  .check-row.checked .check-box{ background:var(--grad-main); border-color:transparent; }
  .check-row .rlabel{ flex:1; font-size:14px; font-weight:600; }
  .check-row .rcount{ font-size:12px; color:var(--text-dimmer); }

  /* Empty state */
  .empty{ text-align:center; padding:40px 20px; color:var(--text-dimmer); }
  .empty .icn{ font-size:40px; margin-bottom:10px; }
  .empty p{ font-size:14px; line-height:1.6; }

  /* Section header */
  .sec-head{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px; }
  .sec-head h2{ font-size:15px; color:var(--text-dim); font-weight:700; letter-spacing:.3px; }
  .sec-head:first-child{ margin-top:0; }

  /* Bottom nav — floating pill style */
  .bottomnav{
    position:fixed; bottom:14px; left:10px; right:10px; z-index:50;
    display:flex; background:rgba(21,19,40,0.92); backdrop-filter:blur(10px);
    border:1.5px solid rgba(139,92,246,0.35); border-radius:999px;
    max-width:700px; margin:0 auto; padding:6px; gap:2px;
    box-shadow:0 10px 30px -10px rgba(91,110,245,0.4);
  }
  .bottomnav .nitem{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    padding:8px 2px; color:var(--text-dimmer); font-size:9.5px; cursor:pointer; font-weight:700;
    border-radius:999px; transition:all .15s; white-space:nowrap;
  }
  .bottomnav .nitem .ic{ font-size:17px; }
  .bottomnav .nitem.active{
    background:var(--grad-main); color:#fff;
    box-shadow:0 6px 16px -4px rgba(139,92,246,0.7);
  }
  /* কীবোর্ড খোলা অবস্থায় নিচের নেভ বার লুকিয়ে রাখা হয়, যাতে ইনপুট/বাটন ঢেকে না যায় */
  body.input-focused .bottomnav{ display:none; }

  /* Quiz */
  .qprog{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
  .qprogbar{ height:5px; background:var(--bg-soft); border-radius:3px; overflow:hidden; margin-bottom:18px; }
  .qprogbar .fill{ height:100%; background:var(--grad-main); transition:width .25s; }
  .timer{
    position:fixed; top:70px; right:18px; z-index:40;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px 14px; font-weight:700; font-size:15px; color:var(--gold);
    max-width:720px;
  }
  .timer.low{ color:var(--red); border-color:var(--red); }
  .qtext{ font-size:18px; font-weight:600; line-height:1.6; margin-bottom:20px; }
  .opt{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:var(--bg-soft); border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px;
    cursor:pointer; font-size:15px;
  }
  .opt .olabel{
    width:26px; height:26px; border-radius:50%; background:var(--card); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-dim);
  }
  .opt.selected{ border-color:var(--violet); background:rgba(139,92,246,0.10); }
  .opt.selected .olabel{ background:var(--grad-main); color:#fff; }
  .opt.correct{ border-color:var(--green); background:rgba(61,220,151,0.1); }
  .opt.correct .olabel{ background:var(--green); color:#042014; }
  .opt.wrong{ border-color:var(--red); background:rgba(255,107,107,0.1); }
  .opt.wrong .olabel{ background:var(--red); color:#210000; }
  .explain{
    background:var(--bg-soft); border-left:3px solid var(--gold); border-radius:8px;
    padding:12px 14px; font-size:13px; color:var(--text-dim); margin-top:10px; line-height:1.6;
  }
  .navrow{ display:flex; gap:10px; margin-top:20px; }

  /* Flashcard */
  .flashcard-wrap{ perspective:1200px; margin-bottom:20px; }
  .flashcard{
    min-height:220px; border-radius:20px; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s;
    background:var(--card); border:1px solid var(--line);
  }
  .flashcard.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;
    font-size:18px; font-weight:600; line-height:1.6;
  }
  .fc-front{ background:linear-gradient(135deg, var(--card-hi), var(--card)); }
  .fc-back{ transform:rotateY(180deg); background:linear-gradient(135deg, rgba(139,92,246,0.12), var(--card)); border:1px solid var(--violet); }

  /* Result ring */
  .result-hero{ text-align:center; padding:20px 0 10px; }
  .score-ring{ width:150px; height:150px; margin:0 auto 16px; position:relative; }
  .score-ring svg{ transform:rotate(-90deg); }
  .score-ring .num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring .num .val{ font-size:32px; font-weight:800; font-family:'Baloo Da 2'; }
  .score-ring .num .lbl{ font-size:11px; color:var(--text-dim); }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .stat-box{ background:var(--bg-soft); border-radius:12px; padding:14px; text-align:center; }
  .stat-box .v{ font-size:20px; font-weight:800; }
  .stat-box .l{ font-size:11px; color:var(--text-dimmer); margin-top:2px; }

  .fab-menu{ position:fixed; bottom:80px; right:18px; z-index:45; max-width:720px; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,6,10,0.75); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--bg-soft); width:100%; max-width:720px; border-radius:20px 20px 0 0;
    padding:20px 18px 30px; max-height:85vh; overflow-y:auto;
  }
  .modal-sheet h3{ margin-bottom:16px; }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:200;
    background:var(--card-hi); border:1px solid var(--violet); color:var(--text);
    padding:12px 20px; border-radius:12px; font-size:14px; font-weight:600;
  }
  .del-x{ color:var(--red); font-size:13px; cursor:pointer; padding:4px 8px; }
  a{ color:var(--indigo); }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ EXAM GALAXY — অফলাইন প্র্যাকটিস অ্যাপ ============ */
/* সব ডেটা এই ব্রাউজারের localStorage-এ সেভ হয়। ইন্টারনেট লাগে না। */

const DB_KEY = 'eg_practice_db_v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const data = JSON.parse(raw);
      // পুরনো ডেটাতে লেভেল না থাকলে ডিফল্ট এসএসসি ধরে নেওয়া হচ্ছে
      if(data.subjects) data.subjects.forEach(s=>{ if(!s.level) s.level = 'ssc'; });
      if(!data.flashcards) data.flashcards = [];
      if(!data.vocab) data.vocab = [];
      return data;
    }
  }catch(e){}
  return { subjects:[], chapters:[], questions:[], flashcards:[], history:[], vocab:[] };
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
let DB = loadDB();

/* ---------- simple hash router state ---------- */
let route = { name:'home', params:{} };
let examState = null;   // active exam session
let flashState = null;  // active flashcard session

function nav(name, params={}){
  route = { name, params };
  render();
  window.scrollTo(0,0);
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}

/* ---------- helpers ---------- */
function subjectById(id){ return DB.subjects.find(s=>s.id===id); }
function chaptersOf(subjectId){ return DB.chapters.filter(c=>c.subjectId===subjectId); }
function chapterById(id){ return DB.chapters.find(c=>c.id===id); }
function questionsOf(chapterId){ return DB.questions.filter(q=>q.chapterId===chapterId); }
function flashcardsOf(chapterId){ return DB.flashcards.filter(f=>f.chapterId===chapterId); }
function questionCountForSubject(subjectId){ return DB.questions.filter(q=>q.subjectId===subjectId).length; }
function vocabOf(level){ return DB.vocab.filter(v=>v.level===level); }

function esc(str){
  const d = document.createElement('div');
  d.textContent = str==null? '' : str;
  return d.innerHTML;
}

/* =================================================================
   BOTTOM NAV — floating pill navigation (persistent across screens)
================================================================= */
function bottomNavKeyFor(routeName){
  if(routeName==='home') return 'home';
  if(['admin-subjects','admin-chapters','admin-chapter-content'].includes(routeName)) return 'admin';
  if(['exam-setup','exam-take','exam-result'].includes(routeName)) return 'exam';
  if(['flash-setup','flash-practice'].includes(routeName)) return 'flash';
  if(['vocab-setup','vocab-manage','vocab-take','vocab-result'].includes(routeName)) return 'vocab';
  if(routeName==='history') return 'history';
  return '';
}

function viewBottomNav(){
  const active = bottomNavKeyFor(route.name);
  const items = [
    {key:'home', icon:'🏠', label:'হোম', nav:'home'},
    {key:'exam', icon:iconBrainQuestion(20), label:'পরীক্ষা', nav:'exam-setup'},
    {key:'vocab', icon:'🔤', label:'ভোকাব', nav:'vocab-setup'},
    {key:'flash', icon:'🃏', label:'ফ্ল্যাশ', nav:'flash-setup'},
    {key:'history', icon:'📊', label:'প্রোগ্রেস', nav:'history'},
    {key:'admin', icon:'⚙️', label:'অ্যাডমিন', nav:'admin-subjects'},
  ];
  return `<div class="bottomnav">
    ${items.map(it=>`
      <div class="nitem ${active===it.key?'active':''}" data-nav="${it.nav}">
        <div class="ic">${it.icon}</div>
        <div>${it.label}</div>
      </div>`).join('')}
  </div>`;
}

/* =================================================================
   RENDER — top level switch
================================================================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(route.name){
    case 'home': html = viewHome(); break;
    case 'admin-subjects': html = viewAdminSubjects(); break;
    case 'admin-chapters': html = viewAdminChapters(route.params.subjectId); break;
    case 'admin-chapter-content': html = viewAdminChapterContent(route.params.chapterId); break;
    case 'exam-setup': html = viewExamSetup(); break;
    case 'exam-take': html = viewExamTake(); break;
    case 'exam-result': html = viewExamResult(); break;
    case 'flash-setup': html = viewFlashSetup(); break;
    case 'flash-practice': html = viewFlashPractice(); break;
    case 'vocab-setup': html = viewVocabSetup(); break;
    case 'vocab-manage': html = viewVocabManage(); break;
    case 'vocab-take': html = viewVocabTake(); break;
    case 'vocab-result': html = viewVocabResult(); break;
    case 'history': html = viewHistory(); break;
    default: html = viewHome();
  }
  const hideNav = (route.name==='exam-take' || route.name==='flash-practice' || route.name==='vocab-take');
  app.innerHTML = html + (hideNav? '' : viewBottomNav());
  attachHandlers();
}

/* =================================================================
   HOME
================================================================= */
function isStandaloneMode(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }catch(e){ return false; }
}

function viewHome(){
  const totalQ = DB.questions.length;
  const totalF = DB.flashcards.length;
  const subjCount = DB.subjects.length;
  const showInstallTip = !isStandaloneMode() && !localStorage.getItem('eg_hide_install_tip');
  return `
  <div class="topbar">
    <div>
      <h1>🚀 T-PREP</h1>
      <div class="tag">তোমার নিজের প্র্যাকটিস মহাবিশ্ব</div>
    </div>
  </div>
  <main>
    ${showInstallTip? `
    <div class="card" style="border-color:var(--cyan);">
      <div class="card-row" style="align-items:flex-start;">
        <div style="flex:1;">
          <b>📲 হোম স্ক্রিনে আইকন যোগ করো</b>
          <p style="font-size:13px; color:var(--text-dim); margin-top:6px; line-height:1.7;">
          এই পেজটা ব্রাউজার মেনু থেকে <b>"Add to Home screen"</b> চাপলে ফোনের হোম স্ক্রিনে সাধারণ অ্যাপের মতো আইকন হয়ে বসে যাবে। পরে ঐ আইকনে চাপলেই সরাসরি অ্যাপ খুলবে।
          </p>
        </div>
        <div class="del-x" id="hideInstallTip">✕</div>
      </div>
    </div>` : ''}

    <div class="stat-grid">
      <div class="stat-box"><div class="v">${subjCount}</div><div class="l">বিষয়</div></div>
      <div class="stat-box"><div class="v">${totalQ}</div><div class="l">মোট প্রশ্ন</div></div>
    </div>

    <div class="sec-head"><h2>পরীক্ষা দাও</h2></div>
    <div class="planet-btn" data-nav="exam-setup">
      <div class="planet-icon" style="background:radial-gradient(circle at 30% 30%, var(--cyan), #0E6478);">⏱️</div>
      <div class="meta"><div class="name">MCQ পরীক্ষা দাও</div><div class="sub">টাইমার সহ, নিজের অধ্যায় বেছে নিয়ে</div></div>
      <div class="chev">›</div>
    </div>
    <div class="planet-btn" data-nav="flash-setup">
      <div class="planet-icon" style="background:radial-gradient(circle at 30% 30%, var(--magenta), #7A1A5C);">🃏</div>
      <div class="meta"><div class="name">ফ্ল্যাশকার্ড প্র্যাকটিস</div><div class="sub">${totalF} টি কার্ড আছে</div></div>
      <div class="chev">›</div>
    </div>
    <div class="planet-btn" data-nav="vocab-setup">
      <div class="planet-icon" style="background:radial-gradient(circle at 30% 30%, var(--indigo), #1E2B7A);">🔤</div>
      <div class="meta"><div class="name">ভোকাবুলারি প্র্যাকটিস</div><div class="sub">${DB.vocab.length} টি শব্দ আছে • অটো প্রশ্ন তৈরি হয়</div></div>
      <div class="chev">›</div>
    </div>
    <div class="planet-btn" data-nav="history">
      <div class="planet-icon" style="background:radial-gradient(circle at 30% 30%, var(--gold), #8A6E00);">📊</div>
      <div class="meta"><div class="name">আগের রেজাল্ট</div><div class="sub">${DB.history.length} টি পরীক্ষা দেওয়া হয়েছে</div></div>
      <div class="chev">›</div>
    </div>

    <div class="sec-head"><h2>নিজে প্রশ্ন যোগ করো</h2></div>
    <div class="planet-btn" data-nav="admin-subjects">
      <div class="planet-icon" style="background:radial-gradient(circle at 30% 30%, var(--green), #106647);">⚙️</div>
      <div class="meta"><div class="name">অ্যাডমিন প্যানেল</div><div class="sub">বিষয়, অধ্যায়, প্রশ্ন ও ফ্ল্যাশকার্ড ম্যানেজ করো</div></div>
      <div class="chev">›</div>
    </div>

    ${subjCount===0? `
    <div class="card" style="margin-top:20px; border-color:var(--gold);">
      <b>👋 শুরু করতে চাও?</b>
      <p style="font-size:13px; color:var(--text-dim); margin-top:8px; line-height:1.6;">
      প্রথমে "অ্যাডমিন প্যানেল"-এ গিয়ে একটা বিষয় (যেমন: রসায়ন) যোগ করো, তারপর অধ্যায় ও প্রশ্ন যোগ করো। এরপর পরীক্ষা দিতে পারবে।
      </p>
    </div>` : ''}
  </main>`;
}

/* =================================================================
   ADMIN — SUBJECTS
================================================================= */
let adminLevelTab = 'ssc';
const LEVEL_LABEL = { ssc:'এসএসসি (SSC)', hsc:'এইচএসসি (HSC)' };

function viewAdminSubjects(){
  const filtered = DB.subjects.filter(s=>s.level===adminLevelTab);
  const rows = filtered.map(s=>{
    const chCount = chaptersOf(s.id).length;
    const qCount = questionCountForSubject(s.id);
    return `
    <div class="planet-btn" data-nav="admin-chapters" data-subject="${s.id}">
      <div class="planet-icon">📘</div>
      <div class="meta"><div class="name">${esc(s.name)}</div><div class="sub">${chCount} অধ্যায় • ${qCount} প্রশ্ন</div></div>
      <div class="del-x" data-del-subject="${s.id}">✕ মুছুন</div>
    </div>`;
  }).join('');

  return `

/* =================================================================
   EXAM TAKE
================================================================= */
function shuffleArr(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startExam(){
  let pool = [];
  examSel.chapterIds.forEach(id=> pool = pool.concat(questionsOf(id)) );
  pool = shuffleArr(pool);
  if(examSel.questionLimit !== 'all'){
    pool = pool.slice(0, parseInt(examSel.questionLimit));
  }
  // shuffle options within each question, tracking correct answer text
  const prepared = pool.map(q=>{
    const optionObjs = q.options.map((text,idx)=>({text, isCorrect: idx===q.correct}));
    const shuffled = shuffleArr(optionObjs);
    return {
      id:q.id, q:q.q, explain:q.explain,
      options: shuffled.map(o=>o.text),
      correct: shuffled.findIndex(o=>o.isCorrect)
    };
  });

  examState = {
    questions: prepared,
    current: 0,
    answers: new Array(prepared.length).fill(null),
    revealed: new Array(prepared.length).fill(false),
    timerMin: examSel.timerMin,
    secondsLeft: examSel.timerMin>0 ? examSel.timerMin*60 : null,
    startedAt: Date.now(),
    timerHandle: null
  };
  nav('exam-take');
  if(examState.secondsLeft!==null){
    examState.timerHandle = setInterval(()=>{
      examState.secondsLeft--;
      if(examState.secondsLeft<=0){
        clearInterval(examState.timerHandle);
        finishExam();
      } else {
        updateTimerDisplay();
      }
    },1000);
  }
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el || !examState || examState.secondsLeft===null) return;
  const m = Math.floor(examState.secondsLeft/60);
  const s = examState.secondsLeft%60;
  el.textContent = `⏱️ ${m}:${s.toString().padStart(2,'0')}`;
  el.parentElement.classList.toggle('low', examState.secondsLeft<=60);
}

function viewExamTake(){
  if(!examState) { nav('exam-setup'); return ''; }
  const i = examState.current;
  const total = examState.questions.length;
  const q = examState.questions[i];
  const ans = examState.answers[i];
  const revealed = examState.revealed[i];

  const optsHtml = q.options.map((opt,idx)=>{
    let cls = 'opt';
    if(revealed){
      if(idx===q.correct) cls += ' correct';
      else if(idx===ans) cls += ' wrong';
    } else if(idx===ans){
      cls += ' selected';
    }
    return `<div class="${cls}" data-pick="${idx}">
      <div class="olabel">${String.fromCharCode(2453+idx)}</div>
      <div>${esc(opt)}</div>
    </div>`;
  }).join('');

  return `
  <div class="topbar">
    <div class="back" data-confirm-exit="exam">✕</div>
    <h1>প্রশ্ন ${i+1} / ${total}</h1>
  </div>
  ${examState.secondsLeft!==null? `<div class="timer" id="timerBox"><span id="timerDisplay"></span></div>`:''}
  <main>
    <div class="qprog">${i+1} নং প্রশ্ন</div>
    <div class="qprogbar"><div class="fill" style="width:${((i+1)/total)*100}%"></div></div>
    <div class="qtext">${esc(q.q)}</div>
    ${optsHtml}
    ${revealed && q.explain ? `<div class="explain">💡 ${esc(q.explain)}</div>` : ''}
    <div class="navrow">
      ${i>0? `<button class="btn btn-ghost" data-prevq="1">← আগেরটা</button>`:''}
      <button class="btn btn-primary" style="flex:1;" data-nextq="1">${i===total-1? 'শেষ করো ✅' : 'পরেরটা →'}</button>
    </div>
  </main>`;
}

function finishExam(){
  if(examState.timerHandle) clearInterval(examState.timerHandle);
  let correct = 0;
  examState.questions.forEach((q,idx)=>{ if(examState.answers[idx]===q.correct) correct++; });
  const total = examState.questions.length;
  const timeTakenSec = Math.round((Date.now()-examState.startedAt)/1000);

  const subjNames = [...new Set([...examSel.chapterIds].map(id=>{
    const ch = chapterById(id); return ch? subjectById(ch.subjectId)?.name : '';
  }))].filter(Boolean);
  const chapNames = [...examSel.chapterIds].map(id=>chapterById(id)?.name).filter(Boolean);

  const record = {
    id: uid(),
    date: new Date().toISOString(),
    subjects: subjNames,
    chapters: chapNames,
    total, correct,
    percent: total>0? Math.round((correct/total)*100) : 0,
    timeTakenSec
  };
  DB.history.unshift(record);
  saveDB();
  examState.finished = true;
  examState.lastRecord = record;
  nav('exam-result');
}

/* =================================================================
   VOCABULARY — শব্দ যোগ করলেই অ্যাপ নিজে থেকে ৩ ধরনের প্রশ্ন বানায়
================================================================= */
let vocabLevelTab = 'ssc';
let vocabSel = { count:'20', types:new Set(['meaning','word','spelling']) };
let vocabState = null;

/* ---- বানান বিকৃত করার ছোট্ট ইঞ্জিন (ভুল অপশন বানানোর জন্য) ---- */
function makeMisspelling(word){
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  for(let attempt=0; attempt<10; attempt++){
    let w = word.split('');
    if(w.length<2){
      w.push(letters[Math.floor(Math.random()*26)]);
    } else {
      const op = ['swap','delete','dup','replace'][Math.floor(Math.random()*4)];
      const i = Math.floor(Math.random()*w.length);
      if(op==='swap' && w.length>1){
        const j = i===w.length-1? i-1 : i+1;
        [w[i],w[j]] = [w[j],w[i]];
      } else if(op==='delete' && w.length>2){
        w.splice(i,1);
      } else if(op==='dup'){
        w.splice(i,0,w[i]);
      } else {
        let r;
        do{ r = letters[Math.floor(Math.random()*26)]; }while(r===w[i].toLowerCase());
        w[i] = r;
      }
    }
    const result = w.join('');
    if(result.toLowerCase() !== word.toLowerCase()) return result;
  }
  return word + 'x';
}

function uniqueMisspellings(word, count){
  const seen = new Set([word.toLowerCase()]);
  const out = [];
  let guard = 0;
  while(out.length<count && guard<40){
    guard++;
    const m = makeMisspelling(word);
    if(!seen.has(m.toLowerCase())){
      seen.add(m.toLowerCase());
      out.push(m);
    }
  }
  return out;
}

/* ---- পুল থেকে র‍্যান্ডম ডিস্ট্র্যাক্টর (ভুল অপশন) বাছাই ---- */
function pickDistractors(pool, excludeId, field, n){
  const others = pool.filter(v=>v.id!==excludeId);
  const shuffled = shuffleArr(others);
  const out = [];
  const seen = new Set();
  for(const o of shuffled){
    const val = o[field].trim().toLowerCase();
    if(!seen.has(val)){ seen.add(val); out.push(o[field]); }
    if(out.length>=n) break;
  }
  return out;
}

/* ---- একটা শব্দ থেকে ৩ ধরনের প্রশ্ন বানানো ---- */
function buildVocabQuestions(word, pool, enabledTypes){
  const qs = [];
  const maxDistractors = Math.min(3, pool.length-1);

  if(enabledTypes.has('meaning') && maxDistractors>=1){
    const distractors = pickDistractors(pool, word.id, 'meaning', maxDistractors);
    const options = shuffleArr([word.meaning, ...distractors]);
    qs.push({
      type:'meaning',
      q: `"${word.word}" শব্দটির বাংলা অর্থ কী?`,
      options,
      correct: options.indexOf(word.meaning)
    });
  }
  if(enabledTypes.has('word') && maxDistractors>=1){
    const distractors = pickDistractors(pool, word.id, 'word', maxDistractors);
    const options = shuffleArr([word.word, ...distractors]);
    qs.push({
      type:'word',
      q: `কোন ইংরেজি শব্দের অর্থ "${word.meaning}"?`,
      options,
      correct: options.indexOf(word.word)
    });
  }
  if(enabledTypes.has('spelling')){
    const wrongSpellings = uniqueMisspellings(word.word, Math.min(3, Math.max(1, maxDistractors||3)));
    const options = shuffleArr([word.word, ...wrongSpellings]);
    qs.push({
      type:'spelling',
      q: `"${word.meaning}" — এর সঠিক ইংরেজি বানানটি বেছে নাও`,
      options,
      correct: options.indexOf(word.word)
    });
  }
  return qs;
}

function startVocab(){
  const pool = vocabOf(vocabLevelTab);
  let words = shuffleArr(pool);
  if(vocabSel.count!=='all') words = words.slice(0, parseInt(vocabSel.count));

  let questions = [];
  words.forEach(w=>{
    questions = questions.concat(buildVocabQuestions(w, pool, vocabSel.types));
  });
  questions = shuffleArr(questions);

  if(questions.length===0){
    toast('প্রশ্ন বানানোর জন্য আরও শব্দ দরকার (কমপক্ষে ২টি)');
    return;
  }

  vocabState = {
    questions,
    current:0,
    answers: new Array(questions.length).fill(null),
    revealed: new Array(questions.length).fill(false),
    startedAt: Date.now()
  };
  nav('vocab-take');
}

function viewVocabTake(){
  if(!vocabState){ nav('vocab-setup'); return ''; }
  const i = vocabState.current;
  const total = vocabState.questions.length;
  const q = vocabState.questions[i];
  const ans = vocabState.answers[i];
  const revealed = vocabState.revealed[i];

  const optsHtml = q.options.map((opt,idx)=>{
    let cls = 'opt';
    if(revealed){
      if(idx===q.correct) cls += ' correct';
      else if(idx===ans) cls += ' wrong';
    } else if(idx===ans){
      cls += ' selected';
    }
    return `<div class="${cls}" data-vocab-pick="${idx}">
      <div class="olabel">${String.fromCharCode(2453+idx)}</div>
      <div>${esc(opt)}</div>
    </div>`;
  }).join('');

  return `
  <div class="topbar">
    <div class="back" data-confirm-exit="vocab">✕</div>
    <h1>শব্দ ${i+1} / ${total}</h1>

      ${i>0? `<button class="btn btn-ghost" data-vocab-prevq="1">← আগেরটা</button>`:''}

  </main>`;
}

function finishVocab(){
  let correct = 0;
  vocabState.questions.forEach((q,idx)=>{ if(vocabState.answers[idx]===q.correct) correct++; });

  vocabState.correctCount = correct;
  nav('vocab-result');
}

      const id = el.getAttribute('data-del-subject');
      if(confirm('এই বিষয়ের সব অধ্যায় ও প্রশ্ন মুছে যাবে। নিশ্চিত?')){
        const chIds = chaptersOf(id).map(c=>c.id);
        DB.chapters = DB.chapters.filter(c=>c.subjectId!==id);
        DB.questions = DB.questions.filter(q=>q.subjectId!==id);
        DB.flashcards = DB.flashcards.filter(f=>f.subjectId!==id);
        DB.subjects = DB.subjects.filter(s=>s.id!==id);
        saveDB();
        toast('মুছে ফেলা হয়েছে');
        render();
      }
    });
  });

  // Add chapter
  const addChapterBtn = document.getElementById('addChapterBtn');
  if(addChapterBtn) addChapterBtn.addEventListener('click', ()=>{
    const subjectId = addChapterBtn.getAttribute('data-subject');
    const input = document.getElementById('newChapterName');
    const name = input.value.trim();
    if(!name){ toast('অধ্যায়ের নাম লেখো'); return; }
    DB.chapters.push({id:uid(), subjectId, name});
    saveDB();
    toast('অধ্যায় যোগ হয়েছে ✅');
    render();
  });

  // Delete chapter
  document.querySelectorAll('[data-del-chapter]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-del-chapter');
      if(confirm('এই অধ্যায়ের সব প্রশ্ন ও ফ্ল্যাশকার্ড মুছে যাবে। নিশ্চিত?')){
        DB.questions = DB.questions.filter(q=>q.chapterId!==id);
        DB.flashcards = DB.flashcards.filter(f=>f.chapterId!==id);
        DB.chapters = DB.chapters.filter(c=>c.id!==id);
        saveDB();
        toast('মুছে ফেলা হয়েছে');
        render();
      }
    });
  });

  // Chapter tab switch
  document.querySelectorAll('[data-chaptertab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      chapterTab = el.getAttribute('data-chaptertab');
      render();
    });
  });

  // Add question
  const addQBtn = document.getElementById('addQuestionBtn');
  if(addQBtn) addQBtn.addEventListener('click', ()=>{
    const chapterId = addQBtn.getAttribute('data-chapter');
    const subjectId = addQBtn.getAttribute('data-subject');
    const qText = document.getElementById('qText').value.trim();
    const opts = [0,1,2,3].map(i=>document.getElementById('opt'+i).value.trim());
    const correct = parseInt(document.getElementById('correctOpt').value);
    const explain = document.getElementById('qExplain').value.trim();
    if(!qText || opts.some(o=>!o)){ toast('প্রশ্ন ও সবগুলো অপশন পূরণ করো'); return; }
    DB.questions.push({id:uid(), subjectId, chapterId, q:qText, options:opts, correct, explain});
    saveDB();
    toast('প্রশ্ন যোগ হয়েছে ✅');
    render();
  });

  // Delete question
  document.querySelectorAll('[data-del-question]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-del-question');
      if(confirm('প্রশ্নটি মুছে ফেলতে চাও?')){
        DB.questions = DB.questions.filter(q=>q.id!==id);
        saveDB(); render();
      }
    });
  });

  // Add flashcard
  const addFBtn = document.getElementById('addFlashcardBtn');
  if(addFBtn) addFBtn.addEventListener('click', ()=>{
    const chapterId = addFBtn.getAttribute('data-chapter');
    const subjectId = addFBtn.getAttribute('data-subject');
    const front = document.getElementById('fFront').value.trim();
    const back = document.getElementById('fBack').value.trim();
    const note = document.getElementById('fNote').value.trim();
    if(!front || !back){ toast('দুই পাশই পূরণ করো'); return; }
    DB.flashcards.push({id:uid(), subjectId, chapterId, front, back, note});
    saveDB();
    toast('ফ্ল্যাশকার্ড যোগ হয়েছে ✅');
    render();
  });

  // Delete flashcard
  document.querySelectorAll('[data-del-flashcard]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-del-flashcard');
      if(confirm('কার্ডটি মুছে ফেলতে চাও?')){
        DB.flashcards = DB.flashcards.filter(f=>f.id!==id);
        saveDB(); render();
      }
    });
  });

  // Exam setup: toggle chapter
  document.querySelectorAll('[data-toggle-chapter]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle-chapter');
      if(examSel.chapterIds.has(id)) examSel.chapterIds.delete(id);
      else examSel.chapterIds.add(id);
      render();
    });
  });
  document.querySelectorAll('[data-selectall-subject]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const subjectId = el.getAttribute('data-selectall-subject');
      const chs = chaptersOf(subjectId).filter(c=>questionsOf(c.id).length>0);
      const allSelected = chs.every(c=>examSel.chapterIds.has(c.id));
      chs.forEach(c=>{
        if(allSelected) examSel.chapterIds.delete(c.id);
        else examSel.chapterIds.add(c.id);
      });
      render();
    });
  });
  document.querySelectorAll('[data-exam-level-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      examLevelTab = el.getAttribute('data-exam-level-tab');
      render();
    });
  });

  const qLimitSelect = document.getElementById('qLimitSelect');
  if(qLimitSelect){
    qLimitSelect.value = examSel.questionLimit;
    qLimitSelect.addEventListener('change', ()=>{ examSel.questionLimit = qLimitSelect.value; });
  }
  const timerInput = document.getElementById('timerInput');
  if(timerInput) timerInput.addEventListener('change', ()=>{ examSel.timerMin = parseInt(timerInput.value)||0; });

  const startExamBtn = document.getElementById('startExamBtn');
  if(startExamBtn) startExamBtn.addEventListener('click', startExam);

  // Exam taking
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(examState.revealed[examState.current]) return; // already revealed, lock
      const idx = parseInt(el.getAttribute('data-pick'));
      examState.answers[examState.current] = idx;
      examState.revealed[examState.current] = true;
      render();
      if(examState.secondsLeft!==null) updateTimerDisplay();
    });
  });
  const nextBtn = document.querySelector('[data-nextq]');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(examState.current < examState.questions.length-1){
      examState.current++;
      render();
      if(examState.secondsLeft!==null) updateTimerDisplay();
    } else {
      finishExam();
    }
  });
  const prevBtn = document.querySelector('[data-prevq]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    examState.current--;
    render();
    if(examState.secondsLeft!==null) updateTimerDisplay();
  });
  if(examState && examState.secondsLeft!==null) updateTimerDisplay();

  // Flashcard setup
  document.querySelectorAll('[data-toggle-flash-chapter]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle-flash-chapter');
      if(flashSel.chapterIds.has(id)) flashSel.chapterIds.delete(id);
      else flashSel.chapterIds.add(id);
      render();
    });
  });
  document.querySelectorAll('[data-flash-level-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      flashLevelTab = el.getAttribute('data-flash-level-tab');
      render();
    });
  });
  const startFlashBtn = document.getElementById('startFlashBtn');
  if(startFlashBtn) startFlashBtn.addEventListener('click', startFlash);

  // Flashcard practice
  const flashcardEl = document.getElementById('flashcardEl');
  if(flashcardEl) flashcardEl.addEventListener('click', ()=>{
    flashState.flipped = !flashState.flipped;
    render();
  });
  const flashNext = document.querySelector('[data-flash-next]');
  if(flashNext) flashNext.addEventListener('click', ()=>{
    if(flashState.current < flashState.cards.length-1){
      flashState.current++;
      flashState.flipped = false;
      render();
    } else {
      toast('সব কার্ড শেষ! 🎉');
      nav('home');
    }
  });
  const flashPrev = document.querySelector('[data-flash-prev]');
  if(flashPrev) flashPrev.addEventListener('click', ()=>{
    flashState.current--;
    flashState.flipped = false;
    render();
  });

  /* ---------- Vocabulary handlers ---------- */
  document.querySelectorAll('[data-vocab-level-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      vocabLevelTab = el.getAttribute('data-vocab-level-tab');
      render();
    });
  });
  document.querySelectorAll('[data-vocab-toggle-type]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.getAttribute('data-vocab-toggle-type');
      if(vocabSel.types.has(t)) vocabSel.types.delete(t);
      else vocabSel.types.add(t);
      render();
    });
  });
  document.querySelectorAll('[data-vocab-count]').forEach(el=>{
    el.addEventListener('click', ()=>{
      vocabSel.count = el.getAttribute('data-vocab-count');
      render();
    });
  });
  const startVocabBtn = document.getElementById('startVocabBtn');
  if(startVocabBtn) startVocabBtn.addEventListener('click', startVocab);

  const addVocabBtn = document.getElementById('addVocabBtn');
  if(addVocabBtn) addVocabBtn.addEventListener('click', ()=>{
    const wordInput = document.getElementById('vWord');
    const meaningInput = document.getElementById('vMeaning');
    const word = wordInput.value.trim();
    const meaning = meaningInput.value.trim();
    if(!word || !meaning){ toast('শব্দ ও অর্থ দুটোই লেখো'); return; }
    DB.vocab.push({id:uid(), word, meaning, level:vocabLevelTab});
    saveDB();
    toast('শব্দ যোগ হয়েছে ✅');
    render();
  });
  document.querySelectorAll('[data-del-vocab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-del-vocab');
      if(confirm('শব্দটি মুছে ফেলতে চাও?')){
        DB.vocab = DB.vocab.filter(v=>v.id!==id);
        saveDB(); render();
      }
    });
  });

  document.querySelectorAll('[data-vocab-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(vocabState.revealed[vocabState.current]) return;
      const idx = parseInt(el.getAttribute('data-vocab-pick'));
      vocabState.answers[vocabState.current] = idx;
      vocabState.revealed[vocabState.current] = true;
      render();
    });
  });
  const vocabNextBtn = document.querySelector('[data-vocab-nextq]');
  if(vocabNextBtn) vocabNextBtn.addEventListener('click', ()=>{
    if(vocabState.current < vocabState.questions.length-1){
      vocabState.current++;
      render();
    } else {
      finishVocab();
    }
  });
  const vocabPrevBtn = document.querySelector('[data-vocab-prevq]');
  if(vocabPrevBtn) vocabPrevBtn.addEventListener('click', ()=>{
    vocabState.current--;
    render();
  });
}

render();

/* ---------- কীবোর্ড ওপেন হলে ইনপুট/বাটন যেন ঢাকা না পড়ে, তার ব্যবস্থাপনা ---------- */
document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT')){
    document.body.classList.add('input-focused');
    setTimeout(()=>{
      t.scrollIntoView({behavior:'smooth', block:'center'});
    }, 280); // কীবোর্ড অ্যানিমেশন শেষ হওয়ার একটু সময় দেওয়া হচ্ছে
  }
});
document.addEventListener('focusout', (e)=>{
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT')){
    document.body.classList.remove('input-focused');
  }
});

</script>
